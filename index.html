<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  Bizziland shared database
  IMPORTANT: put your Supabase Project URL and the public anon key below.
  The anon key is safe to use in a browser; never put a service_role key here.
*/
window.BIZZILAND_SUPABASE_URL = window.BIZZILAND_SUPABASE_URL || 'https://xgmzlsnohkqhfpjtkmwk.supabase.co';
window.BIZZILAND_SUPABASE_ANON_KEY = window.BIZZILAND_SUPABASE_ANON_KEY || 'sb_publishable_KtEUn6FZF2ePC3OwQ9cBGQ_LROpFjPK';

// Supabase is the shared source of truth. The browser also keeps a local cache
// so the website can immediately show the last saved data after reopening.
const BIZZILAND_CACHE_KEY = 'bizziland_students_cache_v1';
const BIZZILAND_SYNC_KEY = 'bizziland_last_sync_v1';

function bizzilandReadCache() {
  try {
    const raw = localStorage.getItem(BIZZILAND_CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn('Could not read local Bizziland cache.', e);
    return [];
  }
}

function bizzilandWriteCache(students) {
  try {
    localStorage.setItem(BIZZILAND_CACHE_KEY, JSON.stringify(students || []));
    localStorage.setItem(BIZZILAND_SYNC_KEY, new Date().toISOString());
  } catch (e) {
    console.warn('Could not write local Bizziland cache.', e);
  }
}

function bizzilandLastSync() {
  try { return localStorage.getItem(BIZZILAND_SYNC_KEY) || ''; }
  catch (e) { return ''; }
}

(function () {
  const configured =
    window.BIZZILAND_SUPABASE_URL &&
    window.BIZZILAND_SUPABASE_ANON_KEY &&
    !window.BIZZILAND_SUPABASE_URL.includes('PASTE_YOUR_') &&
    !window.BIZZILAND_SUPABASE_ANON_KEY.includes('PASTE_YOUR_');

  if (configured && window.supabase) {
    window.bizzilandSupabase = window.supabase.createClient(
      window.BIZZILAND_SUPABASE_URL,
      window.BIZZILAND_SUPABASE_ANON_KEY
    );
  }

  function requireClient() {
    if (!window.bizzilandSupabase) {
      throw new Error('Supabase is not configured. Add the Project URL and anon key near the top of index.html.');
    }
    return window.bizzilandSupabase;
  }

  async function probeColumn(table, candidates) {
    const sb = requireClient();
    for (const column of candidates) {
      const { error } = await sb.from(table).select(column).limit(1);
      if (!error) return column;
    }
    return null;
  }

  let schemaPromise = null;
  async function getSchema() {
    if (!schemaPromise) {
      schemaPromise = (async () => {
        const students = {
          id: await probeColumn('students', ['ID', 'id']),
          serial: await probeColumn('students', ['serial', 'serial_no', 'serial_number']),
          name: await probeColumn('students', ['name', 'full_name', 'student_name']),
          gender: await probeColumn('students', ['gender']),
          phone: await probeColumn('students', ['phone', 'phone_number']),
          module: await probeColumn('students', ['module']),
          admissionDate: await probeColumn('students', ['admission_date', 'admissionDate', 'date_of_admission']),
          station: await probeColumn('students', ['station']),
          fee: await probeColumn('students', ['fee', 'total_fee'])
        };
        if (!students.id) throw new Error('Could not find the students ID column.');
        if (!students.serial || !students.name) throw new Error('Could not match the students serial/name columns.');
        return students;
      })();
    }
    return schemaPromise;
  }

  function clean(obj) {
    return Object.fromEntries(Object.entries(obj).filter(([, v]) => v !== undefined && v !== null));
  }

  async function loadStudentsFromSupabase() {
    const sb = requireClient();
    const schema = await getSchema();
    const columns = Object.values(schema).filter(Boolean).join(',');
    const { data: rows, error } = await sb.from('students').select(columns).order(schema.id, { ascending: false });
    if (error) throw error;

    const ids = (rows || []).map(r => r[schema.id]).filter(v => v !== null && v !== undefined);
    let payments = [];
    if (ids.length) {
      const { data: ps, error: pe } = await sb
        .from('payments')
        .select('id,student_id,amount,payment_date,payment_method,notes')
        .in('student_id', ids)
        .order('payment_date', { ascending: true });
      if (pe) throw pe;
      payments = ps || [];
    }

    const students = (rows || []).map(r => ({
      id: r[schema.id],
      serial: schema.serial ? r[schema.serial] : '',
      name: schema.name ? r[schema.name] : '',
      gender: schema.gender ? r[schema.gender] : '',
      phone: schema.phone ? r[schema.phone] : '',
      module: schema.module ? r[schema.module] : '',
      admissionDate: schema.admissionDate ? r[schema.admissionDate] : '',
      station: schema.station ? r[schema.station] : '',
      fee: schema.fee ? Number(r[schema.fee]) || 0 : 0,
      payments: payments
        .filter(p => String(p.student_id) === String(r[schema.id]))
        .map(p => ({
          id: p.id,
          amount: Number(p.amount) || 0,
          date: p.payment_date || '',
          method: p.payment_method || '',
          description: p.notes || 'Fee payment'
        }))
    }));

    // Every successful shared-database read refreshes the local browser copy.
    bizzilandWriteCache(students);
    return students;
  }

  function loadStudentsFromLocalCache() {
    return bizzilandReadCache();
  }

  async function insertStudentIntoSupabase(form) {
    const sb = requireClient();
    const schema = await getSchema();
    const row = clean({
      [schema.serial]: form.serial.trim(),
      [schema.name]: form.name.trim(),
      [schema.gender]: form.gender || null,
      [schema.phone]: form.phone || null,
      [schema.module]: form.module || null,
      [schema.admissionDate]: form.admissionDate || null,
      [schema.station]: form.station || null,
      [schema.fee]: Number(form.fee) || 0
    });
    const { data, error } = await sb.from('students').insert(row).select('*').single();
    if (error) throw error;
    return data[schema.id];
  }

  async function insertPaymentIntoSupabase(studentId, amount, date) {
    const sb = requireClient();
    const row = {
      student_id: studentId,
      amount: Number(amount) || 0,
      payment_date: date || new Date().toISOString().slice(0, 10),
      payment_method: 'Fee payment',
      notes: 'Fee payment'
    };
    const { data, error } = await sb.from('payments').insert(row).select('id,student_id,amount,payment_date,payment_method,notes').single();
    if (error) throw error;
    return {
      id: data.id,
      amount: Number(data.amount) || 0,
      date: data.payment_date || '',
      method: data.payment_method || '',
      description: data.notes || 'Fee payment'
    };
  }

  async function deleteStudentFromSupabase(id) {
    const sb = requireClient();
    // Delete payments first because the payments table has a foreign key to students.
    const { error: pe } = await sb.from('payments').delete().eq('student_id', id);
    if (pe) throw pe;
    const schema = await getSchema();
    const { error } = await sb.from('students').delete().eq(schema.id, id);
    if (error) throw error;
  }

  window.bizzilandDb = {
    loadStudents: loadStudentsFromSupabase,
    loadCachedStudents: loadStudentsFromLocalCache,
    cacheStudents: bizzilandWriteCache,
    lastSync: bizzilandLastSync,
    insertStudent: insertStudentIntoSupabase,
    insertPayment: insertPaymentIntoSupabase,
    deleteStudent: deleteStudentFromSupabase,
    configured
  };
})();
</script>

  function money(n){return 'KES '+(Number(n)||0).toLocaleString('en-KE')}
  function paid(s){return (s.payments||[]).reduce((a,p)=>a+(Number(p.amount)||0),0)}
  function balance(s){return (Number(s.fee)||0)-paid(s)}
  function status(s){return balance(s)<=0?'CLEARED':'OWING'}

  async function getStudents(){

  function printDocument(title, body) {
  const printWindow = window.open('', '_blank', 'width=900,height=700');

  if (!printWindow) {

  printWindow.document.write(`

      <hr>

    </body>

  `);

  printWindow.document.close();

  printWindow.focus();

  setTimeout(() => {
    printWindow.print();
  }, 500);

  window.bizzilandPrintReceipt=function(s,p){
    const bal=balance({...s,payments:[...(s.payments||[]),p]});
    printDocument('Receipt',`
      <h2>OFFICIAL FEE PAYMENT RECEIPT</h2>
      <p><b>Student ID:</b> ${s.id}</p>
      <p><b>Serial No:</b> ${s.serial||''}</p>
      <p><b>Student Name:</b> ${s.name}</p>
      <p><b>Module:</b> ${s.module||''}</p>
      <p><b>Payment Date:</b> ${p.date||''}</p>
      <h3>Amount Paid: ${money(p.amount)}</h3>
      <p><b>Total Fee:</b> ${money(s.fee)}</p>
      <p><b>Total Paid:</b> ${money(paid({...s,payments:[...(s.payments||[]),p]}))}</p>
      <p><b>Balance:</b> ${money(bal)}</p>
      <p style="margin-top:50px">Authorized by: __________________________</p>
    `);
  };

  window.bizzilandPrintStatement=function(s){
    const history=(s.payments||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${p.date||''}</td><td>${money(p.amount)}</td><td>${p.description||'Fee payment'}</td></tr>`).join('');
    printDocument('Statement',`
      <h2>STUDENT FEE STATEMENT</h2>
      <p><b>Student ID:</b> ${s.id}</p>
      <p><b>Serial No:</b> ${s.serial||''}</p>
      <p><b>Name:</b> ${s.name}</p>
      <p><b>Phone:</b> ${s.phone||''}</p>
      <p><b>Gender:</b> ${s.gender||''}</p>
      <p><b>Module:</b> ${s.module||''}</p>
      <p><b>Station:</b> ${s.station||''}</p>
      <table style="width:100%;border-collapse:collapse;margin-top:20px">

       ${history}
      </table>
      <h3>Total Fee: ${money(s.fee)}</h3><h3>Total Paid: ${money(paid(s))}</h3><h3>Balance: ${money(balance(s))}</h3>
      <p><b>Status:</b> ${status(s)}</p>
    `);
  };

  window.bizzilandUpgrade=function(){
    // Avoid installing twice.
    if(document.getElementById('bizziland-upgrade'))return;
    const root=document.getElementById('app-root');
    if(!root)return;

    // Add a lightweight navigation/search panel to the existing app after React renders.
    const observer=new MutationObserver(()=>{
      if(!root.querySelector('.wrap') || document.getElementById('bizziland-upgrade'))return;
      const wrap=root.querySelector('.wrap');
      const panel=document.createElement('div');
      panel.id='bizziland-upgrade';
      panel.innerHTML=`
        <div class="card">
          <h2>Management Tools</h2>
          <p class="card-note">Search, view statements, record payments and export your records.</p>
          <div class="upgrade-toolbar">
            <input id="upgrade-search" class="upgrade-search" placeholder="Search student by name, serial, phone or ID...">
            <button class="submit-btn" id="upgrade-refresh">Refresh</button>
            <button class="submit-btn" id="upgrade-export">Export CSV</button>
          </div>
          <div id="upgrade-results"></div>
        </div>`;
      wrap.insertBefore(panel,wrap.firstChild);

      async function render(){
        const q=(document.getElementById('upgrade-search').value||'').toLowerCase().trim();
        const ss=await getStudents();
        const filtered=ss.filter(s=>!q||[s.id,s.serial,s.name,s.phone,s.module,s.station].join(' ').toLowerCase().includes(q));
        const box=document.getElementById('upgrade-results');
        if(!filtered.length){box.innerHTML='<div class="empty-state">No matching students found.</div>';return}
        box.innerHTML=`<table><thead><tr><th>Student</th><th>Module</th><th>Fee</th><th>Paid</th><th>Balance</th><th>Actions</th></tr></thead><tbody>`+
          filtered.slice(0,100).map(s=>`<tr>
            <td><b>${s.name}</b><br><span style="font-size:11px">${s.id} · ${s.serial||''}</span></td>
            <td>${s.module||''}</td><td class="money-cell">${money(s.fee)}</td>
            <td class="money-cell">${money(paid(s))}</td>
            <td><span class="upgrade-badge ${balance(s)>0?'owing':''}">${balance(s)<=0?'CLEARED':money(balance(s))}</span></td>
            <td><div class="row-actions">
              <button class="mini-btn" data-statement="${s.id}">Statement</button>
              <button class="mini-btn" data-payment="${s.id}">Payment</button>
            </div></td>
          </tr>`).join('')+'</tbody></table>';

        box.querySelectorAll('[data-statement]').forEach(b => {
  b.onclick = () => {
    alert('STATEMENT BUTTON WORKS');

    const s = filtered.find(x => x.id == b.dataset.statement);

    if (!s) {
      alert('Student record not found');
      return;
    }

    alert('Student found: ' + s.name);

    bizzilandPrintStatement(s);
  };
});
        box.querySelectorAll('[data-payment]').forEach(b=>b.onclick=async()=>{
          const s=ss.find(x=>x.id===b.dataset.payment);
          if(!s)return;
          const amount=prompt('Enter payment amount (KES):');
          if(!amount||Number(amount)<=0)return;
          const p=await window.bizzilandDb.insertPayment(s.id,Number(amount),new Date().toISOString().slice(0,10));
          bizzilandPrintReceipt(s,p);
          render();
        });
      }
      document.getElementById('upgrade-search').addEventListener('input',render);
      document.getElementById('upgrade-refresh').onclick=render;
      document.getElementById('upgrade-export').onclick=async()=>{
        const ss=await getStudents();
        const rows=[['Student ID','Serial','Name','Gender','Phone','Module','Station','Admission Date','Fee','Paid','Balance','Status']];
        ss.forEach(s=>rows.push([s.id,s.serial,s.name,s.gender,s.phone,s.module,s.station,s.admissionDate,s.fee,paid(s),balance(s),status(s)]));
        const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n');
        const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bizziland-students.csv';a.click();
      };
      render();
      observer.disconnect();
    });
    observer.observe(root,{childList:true,subtree:true});
  };
  window.bizzilandUpgrade();
})();
</script>

  const [view, setView] = useState('gate');
  const [role, setRole] = useState(null); // null | 'admin' | 'staff'
  const [adminInput, setAdminInput] = useState('');
  const [adminError, setAdminError] = useState('');
  const [staffInput, setStaffInput] = useState('');
  const [staffError, setStaffError] = useState('');

  const [payOpenId, setPayOpenId] = useState(null);
  const [payAmount, setPayAmount] = useState('');
  const [payDate, setPayDate] = useState('');

  useEffect(() => {
  if (role === 'admin' || role === 'staff') {
    loadStudents();
  }
}, [role]);

  async function loadStudents() {
    // Show the last local copy immediately after reopening the website.
    const cached = window.bizzilandDb.loadCachedStudents();
    if (cached.length) {
      setStudents(cached);
      setLoading(false);
    } else {
      setLoading(true);
    }

    try {
      if (!window.bizzilandDb.configured) throw new Error('Supabase is not configured.');
      const entries = await window.bizzilandDb.loadStudents();
      setStudents(entries);
      setStatus({ type: 'ok', text: 'Synced with Supabase. A local copy is also stored in this browser.' });
    } catch (e) {
      console.error(e);
      if (cached.length) {
        setStatus({ type: 'error', text: 'Showing the saved local copy. Supabase could not be reached right now.' });
      } else {
        setStatus({ type: 'error', text: 'Could not load the shared roster. Check Supabase URL/key and RLS policies.' });
      }
    }
    setLoading(false);
  }

  function updateField(field, value) {
    setForm(prev => ({ ...prev, [field]: value }));
  }

  function tryAdminUnlock() {
    if (adminInput === ADMIN_CODE) {
      setRole('admin');
      setAdminInput('');
      setAdminError('');
      setView('app');
    } else {
      setAdminError('Incorrect admin code.');
    }
  }

  function tryStaffUnlock() {
    if (staffInput === STAFF_CODE) {
      setRole('staff');
      setStaffInput('');
      setStaffError('');
      setView('app');
    } else {
      setStaffError('Incorrect staff code.');
    }
  }

  function returnToGate() {
    setAdminInput('');
    setAdminError('');
    setStaffInput('');
    setStaffError('');
    setView('gate');
  }

  function logOut() {
    setRole(null);
    setStudents([]);
    setPayOpenId(null);
    setStatus(null);
    setView('gate');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.name.trim() || !form.serial.trim()) {
      setStatus({ type: 'error', text: 'Serial number and full name are required.' });
      return;
    }
    setSubmitting(true);
    setStatus(null);
    try {
      if (!window.bizzilandDb.configured) throw new Error('Supabase is not configured.');
      const studentId = await window.bizzilandDb.insertStudent(form);
      const payments = [];
      if (form.amountPaid && Number(form.amountPaid) > 0) {
        payments.push(await window.bizzilandDb.insertPayment(studentId, Number(form.amountPaid), form.paymentDate));
      }
      const entries = await window.bizzilandDb.loadStudents();
      window.bizzilandDb.cacheStudents(entries);
      setStudents(entries);
      setForm({ serial: '', name: '', gender: '', phone: '', module: 'Module I', admissionDate: '', station: '', fee: '', amountPaid: '', paymentDate: '' });
      setStatus({ type: 'ok', text: 'Saved to Supabase and to this browser.' });
    } catch (err) {
      console.error(err);
      setStatus({ type: 'error', text: err?.message || 'Something went wrong while saving. Please try again.' });
    }
    setSubmitting(false);
  }

  async function handleDelete(id) {
    try {
      await window.bizzilandDb.deleteStudent(id);
      setStudents(prev => {
        const next = prev.filter(s => s.id !== id);
        window.bizzilandDb.cacheStudents(next);
        return next;
      });
    } catch (e) {
      console.error(e);
      setStatus({ type: 'error', text: 'Could not remove that record from Supabase.' });
    }
  }

  async function handleAddPayment(student) {
    const amt = Number(payAmount);
    if (!amt || amt <= 0) return;
    try {
      await window.bizzilandDb.insertPayment(student.id, amt, payDate);
      const entries = await window.bizzilandDb.loadStudents();
      window.bizzilandDb.cacheStudents(entries);
      setStudents(entries);
      setPayOpenId(null);
      setPayAmount('');
      setPayDate('');
      setStatus({ type: 'ok', text: 'Payment recorded in the shared database.' });
    } catch (e) {
      console.error(e);
      setStatus({ type: 'error', text: 'Could not record that payment in Supabase.' });
    }
  }

  function totalPaid(student) {
    return (student.payments || []).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  }

  const previewPaid = Number(form.amountPaid) || 0;
  const previewFee = Number(form.fee) || 0;
  const previewBalance = previewFee - previewPaid;

  if (view === 'gate') {
    return (
      <div className="gate-screen">
        <div className="gate-card">
          <div className="gate-seal"><Seal /></div>
          <h1>Bizziland Training Centre</h1>
          <div className="gate-sub">Student &amp; Fee Registry</div>

          <div className="gate-form-label">Admin Code</div>
          <input
            type="password"
            inputMode="numeric"
            placeholder="••••••••"
            value={adminInput}
            onChange={e => { setAdminInput(e.target.value); setAdminError(''); }}
            onKeyDown={e => { if (e.key === 'Enter') tryAdminUnlock(); }}
            autoFocus
          />
          {adminError && <div className="gate-error">{adminError}</div>}
          <button className="gate-enter-btn" onClick={tryAdminUnlock}>Enter as Admin</button>
          <div className="gate-role-note">Admin can view every enrolled student and edit records.</div>

          <div className="gate-divider">staff access</div>

          <div className="gate-form-label">Staff Code</div>
          <input
            type="password"
            inputMode="numeric"
            placeholder="••••"
            value={staffInput}
            onChange={e => { setStaffInput(e.target.value); setStaffError(''); }}
            onKeyDown={e => { if (e.key === 'Enter') tryStaffUnlock(); }}
          />
          {staffError && <div className="gate-error">{staffError}</div>}
          <button className="gate-enter-btn gate-enter-btn--staff" onClick={tryStaffUnlock}>Enter as Staff</button>
          <div className="gate-role-note">Staff can only submit new student details — the roster stays hidden.</div>
        </div>
      </div>
    );
  }

  return (
    <React.Fragment>
      <div className="header-band">
        <div className="header-inner">
          <div className="brand-row">
            <Seal />
            <div className="brand-text">
              <h1>Bizziland Training Centre</h1>
              <div className="sub">Student &amp; Fee Registry</div>
            </div>
          </div>
          <div className="staff-zone">
            <span className="role-tag">{role === 'admin' ? 'Admin' : 'Staff'}</span>
            <button className="app-staff-link" onClick={logOut}>Log Out</button>
          </div>
        </div>
      </div>

      <div className="wrap">
        <div className="card">
          <h2>Enrol a Student</h2>
          <p className="card-note">
            {role === 'admin'
              ? 'You can add, edit, and remove student records.'
              : 'Fill in the details and submit. You will not see the student roster.'}
          </p>

          <form onSubmit={handleSubmit}>
              <div className="field-grid">
                <div>
                  <label htmlFor="serial">Serial No.</label>
                  <input id="serial" type="text" value={form.serial}
                    onChange={e => updateField('serial', e.target.value)} placeholder="SN/042/2026" />
                </div>
                <div>
                  <label htmlFor="name">Full Name</label>
                  <input id="name" type="text" value={form.name}
                    onChange={e => updateField('name', e.target.value)} placeholder="e.g. Asha Wanjiru" />
                </div>
                <div>
                  <label htmlFor="gender">Gender</label>
                  <select id="gender" value={form.gender} onChange={e => updateField('gender', e.target.value)}>
                    <option value="">Select</option>
                    <option value="FEMALE">Female</option>
                    <option value="MALE">Male</option>
                    <option value="OTHER">Other</option>
                  </select>
                </div>
              </div>

              <div className="field-grid">
                <div>
                  <label htmlFor="phone">Phone Number</label>
                  <input id="phone" type="tel" value={form.phone}
                    onChange={e => updateField('phone', e.target.value)} placeholder="07XX XXX XXX" />
                </div>
                <div>
                  <label htmlFor="module">Module</label>
                  <select id="module" value={form.module} onChange={e => updateField('module', e.target.value)}>
                    {MODULE_OPTIONS.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div>
                  <label htmlFor="station">Station</label>
                  <input id="station" type="text" value={form.station}
                    onChange={e => updateField('station', e.target.value)} placeholder="e.g. Sheeanie" />
                </div>
              </div>

              <div className="field-grid">
                <div>
                  <label htmlFor="admissionDate">Date of Admission</label>
                  <input id="admissionDate" type="date" value={form.admissionDate}
                    onChange={e => updateField('admissionDate', e.target.value)} />
                </div>
                <div>
                  <label htmlFor="fee">Fee (KES)</label>
                  <input id="fee" type="number" min="0" value={form.fee}
                    onChange={e => updateField('fee', e.target.value)} placeholder="7000" />
                </div>
                <div>
                  <label htmlFor="amountPaid">Amount Paid Now (KES)</label>
                  <input id="amountPaid" type="number" min="0" value={form.amountPaid}
                    onChange={e => updateField('amountPaid', e.target.value)} placeholder="1500" />
                </div>
              </div>

              <div className="field-grid">
                <div>
                  <label htmlFor="paymentDate">Date of Fee Payment</label>
                  <input id="paymentDate" type="date" value={form.paymentDate}
                    onChange={e => updateField('paymentDate', e.target.value)} />
                </div>
              </div>

              <div className="balance-preview">
                Balance after this entry: {formatMoney(previewBalance)}
              </div>

              <button type="submit" className="submit-btn" disabled={submitting}>
                {submitting ? 'Saving…' : 'Submit'}
              </button>

              {status && (
                <div className={'status-msg' + (status.type === 'error' ? ' error' : '')}>
                  {status.text}
                </div>
              )}
            </form>
        </div>

        {role === 'admin' && (
        <div className="card">
          <div className="roster-head">
            <h2>STUDENTS 2026</h2>
            <span className="count-badge">{students.length} record{students.length === 1 ? '' : 's'}</span>
          </div>
          <p className="card-note">Only visible to admin. Shared data is stored in Supabase and a local copy is kept in this browser.</p>

          {loading ? (
            <div className="empty-state">Loading roster…</div>
          ) : students.length === 0 ? (
            <div className="empty-state">No students enrolled yet.</div>
          ) : (
            <table>
              <thead>
                <tr>
                  <th>Serial</th>
                  <th>Name</th>
                  <th>Module</th>
                  <th>Station</th>
                  <th>Fee</th>
                  <th>Paid</th>
                  <th>Balance</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {students.map(s => {
                  const paid = totalPaid(s);
                  const balance = (s.fee || 0) - paid;
                  const isPayOpen = payOpenId === s.id;
                  return (
                    <React.Fragment key={s.id}>
                      <tr>
                        <td className="serial-cell">{s.serial}</td>
                        <td>{s.name}<br /><span style={{fontSize: '11px', color: '#8a8471'}}>{s.gender}{s.phone ? ' · ' + s.phone : ''}</span></td>
                        <td>{s.module}</td>
                        <td>{s.station || '—'}</td>
                        <td className="money-cell">{formatMoney(s.fee)}</td>
                        <td className="money-cell">{formatMoney(paid)}</td>
                        <td>
                          <span className={'balance-tag ' + (balance <= 0 ? 'clear' : 'owing')}>
                            {balance <= 0 ? 'Cleared' : formatMoney(balance)}
                          </span>
                        </td>
                        <td>
                          <div className="row-actions">
                            <button className="mini-btn" onClick={() => { setPayOpenId(isPayOpen ? null : s.id); setPayAmount(''); setPayDate(''); }}>
                              {isPayOpen ? 'Cancel' : 'Add Payment'}
                            </button>
                            <button className="mini-btn danger" onClick={() => handleDelete(s.id)}>Remove</button>
                          </div>
                        </td>
                      </tr>
                      {isPayOpen && (
                        <tr className="pay-row">
                          <td colSpan="8">
                            <div className="pay-form">
                              <div>
                                <label>Amount (KES)</label>
                                <input type="number" min="0" value={payAmount}
                                  onChange={e => setPayAmount(e.target.value)} placeholder="1000" />
                              </div>
                              <div>
                                <label>Date of Payment</label>
                                <input type="date" value={payDate}
                                  onChange={e => setPayDate(e.target.value)} />
                              </div>
                              <button type="button" className="submit-btn" onClick={() => handleAddPayment(s)}>
                                Record Payment
                              </button>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
        )}
      </div>
      <div className="footer-note">Bizziland Training Centre · Upgraded Student & Fee Registry · Search · Statements · Payments · CSV Export</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
